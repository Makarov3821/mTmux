<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; img-src 'none'">
<link rel="stylesheet" href="xterm.css">
<style>
html,body{margin:0;background:#111916;overflow:hidden}
/* Anchor to the WebView viewport: percentage heights can resolve to zero
   while Android measures embedded web content. */
#terminal{position:fixed;inset:0;overflow:hidden;
  /* xterm measures repeated glyphs to cache their advance. Contextual CJK
     punctuation compression makes that measurement disagree with mixed text.
     Keep measurement helpers and painted rows on the same fixed-cell spacing. */
  text-spacing-trim:space-all;
}
</style>
</head><body><div id="terminal"></div>
<script src="xterm.js"></script><script src="addon-fit.js"></script>
<script src="protocol.js"></script><script src="terminal.js"></script>
</body></html>
