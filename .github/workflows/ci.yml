name: Android checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          # Default list includes the removed 'tools' package, which makes sdkmanager fail.
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts && npm test && npm run bundle
        working-directory: web
      - run: git diff --exit-code -- app/src/main/assets/terminal
      - run: npm run test:browser
        working-directory: web
      - run: ./gradlew :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --console=plain
      - run: sudo apt-get update && sudo apt-get install -y tmux openssh-server && sudo mkdir -p /run/sshd
      - run: python3 scripts/test_tmux.py
      - run: python3 scripts/test_ssh.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/lint-results-debug.*
            core/build/reports/tests/
