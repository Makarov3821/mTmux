name: Release APK
# Tag push (v*) builds, verifies and publishes a signed APK as a GitHub release
# (pre-release when the tag has a "-" suffix such as v0.7.1-dev).
# Manual run (Actions → Release APK → Run workflow) is a dry run: it checks the signing
# secrets and uploads the APK as an artifact, without creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write   # gh release create
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      MTMUX_KEYSTORE_PASSWORD: ${{ secrets.MTMUX_KEYSTORE_PASSWORD }}
      MTMUX_KEY_ALIAS: ${{ secrets.MTMUX_KEY_ALIAS }}
      MTMUX_KEY_PASSWORD: ${{ secrets.MTMUX_KEY_PASSWORD }}
      EXPECTED_CERT: ${{ vars.MTMUX_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          # Default list includes the removed 'tools' package, which makes sdkmanager fail.
          packages: "platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v5
      # gradle/actions v6 bundles a proprietary caching component with separate terms; stay on v5 (MIT).

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"; exit 1; }
          echo "Tag matches versionName $version"

      # Only reports which secrets are missing; values are never printed (and are masked anyway).
      - name: Check signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.MTMUX_KEYSTORE_BASE64 }}
        run: |
          # runner.temp is not available in job-level env; export the path for later steps.
          export MTMUX_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "MTMUX_KEYSTORE=$MTMUX_KEYSTORE" >> "$GITHUB_ENV"
          missing=()
          [ -n "$KEYSTORE_B64" ] || missing+=(MTMUX_KEYSTORE_BASE64)
          [ -n "$MTMUX_KEYSTORE_PASSWORD" ] || missing+=(MTMUX_KEYSTORE_PASSWORD)
          [ -n "$MTMUX_KEY_ALIAS" ] || missing+=(MTMUX_KEY_ALIAS)
          [ -n "$MTMUX_KEY_PASSWORD" ] || missing+=(MTMUX_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then echo "::error::Missing secrets: ${missing[*]}"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$MTMUX_KEYSTORE" || { echo "::error::MTMUX_KEYSTORE_BASE64 is not valid base64"; exit 1; }
          # Diagnostics without revealing values: file hash (compare with `sha256sum` locally),
          # whether each secret has surrounding whitespace, then password and alias separately.
          echo "Decoded keystore: $(wc -c < "$MTMUX_KEYSTORE") bytes, sha256 $(sha256sum "$MTMUX_KEYSTORE" | cut -d' ' -f1)"
          for name in MTMUX_KEYSTORE_PASSWORD MTMUX_KEY_ALIAS MTMUX_KEY_PASSWORD; do
            value=${!name}; trimmed=$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [ "$value" = "$trimmed" ] || echo "::warning::$name has leading/trailing whitespace or a newline"
          done
          keytool -list -keystore "$MTMUX_KEYSTORE" -storepass:env MTMUX_KEYSTORE_PASSWORD >/dev/null 2>&1 \
            || { echo "::error::MTMUX_KEYSTORE_PASSWORD does not open this keystore (or MTMUX_KEYSTORE_BASE64 is not the same file)"; exit 1; }
          keytool -list -keystore "$MTMUX_KEYSTORE" -storepass:env MTMUX_KEYSTORE_PASSWORD -alias "$MTMUX_KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::Password is correct, but alias MTMUX_KEY_ALIAS does not exist in the keystore"; exit 1; }
          # PKCS12 (keytool's default) requires the key password to equal the keystore password.
          type=$(keytool -J-Duser.language=en -list -v -keystore "$MTMUX_KEYSTORE" -storepass:env MTMUX_KEYSTORE_PASSWORD 2>/dev/null | sed -n 's/^Keystore type: //p')
          if [ "$type" = PKCS12 ] && [ "$MTMUX_KEY_PASSWORD" != "$MTMUX_KEYSTORE_PASSWORD" ]; then
            echo "::error::Keystore is PKCS12, so MTMUX_KEY_PASSWORD must equal MTMUX_KEYSTORE_PASSWORD"; exit 1
          fi
          keytool -certreq -keystore "$MTMUX_KEYSTORE" -storepass:env MTMUX_KEYSTORE_PASSWORD -alias "$MTMUX_KEY_ALIAS" \
              -keypass:env MTMUX_KEY_PASSWORD -file /dev/null >/dev/null 2>&1 \
            || { echo "::error::MTMUX_KEY_PASSWORD cannot unlock the private key"; exit 1; }
          echo "Keystore opened with the configured password and alias."

      - name: Fetch pinned whisper.cpp and base q5_1
        run: |
          python3 scripts/fetch_voice_benchmark.py deps
          python3 scripts/fetch_voice_benchmark.py base
          python3 scripts/fetch_voice_benchmark.py verify-source
          python3 scripts/fetch_voice_benchmark.py verify-base

      - name: Test and build signed releases
        run: ./gradlew :core:test :voice:testDebugUnitTest :app:testStandardDebugUnitTest :app:testVoiceDebugUnitTest :app:assembleStandardRelease :app:assembleVoiceRelease --console=plain

      - name: Verify APK signatures, separation, model, and size
        run: |
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          standard=app/build/outputs/apk/standard/release/app-standard-release.apk
          voice=app/build/outputs/apk/voice/release/app-voice-release.apk
          expected=$(echo "$EXPECTED_CERT" | tr 'A-F' 'a-f' | tr -d ': ')
          [ -n "$expected" ] || { echo "::error::Repository variable MTMUX_CERT_SHA256 is required for tagged upgrades"; exit 1; }
          certificate=""
          for apk in "$standard" "$voice"; do
            actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            [ -n "$actual" ] || { echo "::error::$apk is not signed"; exit 1; }
            [ -z "$certificate" ] || [ "$actual" = "$certificate" ] || { echo "::error::standard and voice use different certificates"; exit 1; }
            certificate=$actual
            if [ -n "$expected" ] && [ "$actual" != "$expected" ]; then echo "::error::$apk is signed with a different key"; exit 1; fi
          done
          echo "Certificate SHA-256: $certificate"
          standard_size=$(stat -c %s "$standard"); voice_size=$(stat -c %s "$voice")
          ! "$aapt" dump permissions "$standard" | grep RECORD_AUDIO
          "$aapt" dump permissions "$voice" | grep RECORD_AUDIO
          [ "$("$aapt" dump badging "$standard" | sed -n '1p')" = "$("$aapt" dump badging "$voice" | sed -n '1p')" ] \
            || { echo "::error::package/version differ between flavors"; exit 1; }
          ! unzip -l "$standard" | grep -E 'libmtmux_voice|ggml-base-q5_1'
          unzip -l "$voice" | grep 'assets/models/ggml-base-q5_1.bin'
          unzip -l "$voice" | grep 'lib/arm64-v8a/libmtmux_voice.so'
          unzip -l "$voice" | grep 'lib/x86_64/libmtmux_voice.so'
          [ "$(unzip -p "$voice" assets/models/ggml-base-q5_1.bin | sha256sum | cut -d' ' -f1)" = \
            "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898" ]
          test "$(stat -c %s "$voice")" -le $((100 * 1024 * 1024))
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$standard" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$voice" >/dev/null
          standard_name="mtmux-${GITHUB_REF_NAME//\//-}-standard.apk"
          voice_name="mtmux-${GITHUB_REF_NAME//\//-}-voice.apk"
          cp "$standard" "$standard_name"; cp "$voice" "$voice_name"
          sha256sum "$standard_name" > "$standard_name.sha256"
          sha256sum "$voice_name" > "$voice_name.sha256"
          echo "STANDARD_APK_NAME=$standard_name" >> "$GITHUB_ENV"
          echo "VOICE_APK_NAME=$voice_name" >> "$GITHUB_ENV"
          cat > release-notes.md <<EOF
          Two APKs use the same package, version, and release certificate; install one flavor at a time.

          - **standard**: no microphone permission, Whisper model, or voice native library (${standard_size} bytes)
          - **voice**: offline Whisper.cpp 1.9.5 multilingual base q5_1, arm64-v8a + x86_64 (${voice_size} bytes)
          - Model SHA-256: \`422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898\`
          - Certificate SHA-256: \`$certificate\`

          Voice audio and transcription stay on device. Recognition only fills an editable draft and never sends automatically.
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: signed-release-apks
          path: |
            ${{ env.STANDARD_APK_NAME }}
            ${{ env.STANDARD_APK_NAME }}.sha256
            ${{ env.VOICE_APK_NAME }}
            ${{ env.VOICE_APK_NAME }}.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v0.7.1 -> normal release; v0.7.1-dev / v0.8.0-rc.1 (any "-" suffix) -> pre-release
          flag=""
          case "$GITHUB_REF_NAME" in *-*) flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "$STANDARD_APK_NAME" "$STANDARD_APK_NAME.sha256" \
            "$VOICE_APK_NAME" "$VOICE_APK_NAME.sha256" \
            $flag --notes-file release-notes.md --title "mTmux $GITHUB_REF_NAME"

      - name: Remove keystore
        if: always()
        run: rm -f "$MTMUX_KEYSTORE"
