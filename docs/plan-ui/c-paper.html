  <h1>方案 C · 安静纸面（Paper）</h1>
  <p>面向“离开电脑后看一眼、回一句”的场景：暖白纸色、衬线标题、墨黑主按钮，几乎不用卡片和阴影，用细线和留白分层。终端也是浅色纸面。读起来像一份进度报告，夜间可配一套对应的深色“墨纸”版本。</p>
  <div class="tags"><span>标题 Noto Serif CJK，正文系统无衬线</span><span>主操作墨黑胶囊，强调色赭红只用于链接与需处理</span><span>状态用左侧色条 + 文字</span><span>圆角：按钮全圆、弹窗 6</span></div>
