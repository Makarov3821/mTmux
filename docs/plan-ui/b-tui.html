<body class="board">
<header class="board-head">
  <h1>方案 B · 终端原生（TUI）</h1>
  <p>把整个应用当成 tmux 的延伸：全局等宽字体、直角、1px 线框，没有阴影和大圆角。首页像 <code>tmux ls</code> 的树状输出，终端底部借用 tmux 状态栏。信息密度最高，一屏能看到更多任务；对习惯 lazygit / htop 的用户最顺手，但对新手不够友好。</p>
  <div class="tags"><span>全等宽：Ubuntu Sans Mono + Noto Sans Mono CJK</span><span>圆角 0</span><span>强调色青色 #56D4DD，与状态色分开</span><span>按钮、键帽为网格格子</span></div>
  <div class="swatches"><b style="background:#0B0D0F"></b><b style="background:#111418"></b><b style="background:#262B32"></b><b style="background:#56D4DD"></b><b style="background:#FF7070"></b><b style="background:#E5C07B"></b><b style="background:#98C379"></b><b style="background:#5C6370"></b><span>页面 / 面板 / 线 / 强调 / 需处理 / 运行 / 就绪 / 未知</span></div>
</header>
<div class="grid">
