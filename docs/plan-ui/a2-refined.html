<script>
// 状态栏、终端顶栏、底栏片段，避免每屏重复
const SB = '<div class="sbar"><span>20:20</span><span class="r"><i data-i="signal" data-s="13"></i><i data-i="wifi" data-s="13"></i><i data-i="battery" data-s="15"></i></span></div>';
function tbar(dot, sub, opts = {}) {
  const off = opts.off ? ' off' : '';
  return `<div class="tbar"><div class="ib"><i data-i="back"></i></div>
    <div class="tt"><div class="t1">${dot}<span class="ell">开发服务器</span></div><div class="t2 mono ell">${sub}</div></div>
    <div class="ib${off}"><i data-i="keyboard"></i></div><div class="ib${off}${opts.edit ? '" style="color:var(--ac);background:var(--act)' : ''}"><i data-i="edit"></i></div><div class="ib${off}"><i data-i="toBottom"></i></div></div>`;
}
function dock(opts = {}) {
  const off = opts.off ? ' off' : '';
  const mic = opts.mic || '<div class="mic"><i data-i="wave" data-s="24" data-w="2.2"></i></div>';
  return `<div class="dock2">
    <div class="keys${off}"><span class="key">Esc</span><span class="key">Tab</span><span class="key">^C</span><span class="key"><i data-i="arrowUp" data-s="16"></i></span><span class="key"><i data-i="arrowDn" data-s="16"></i></span><span class="key">Enter</span></div>
    <div class="pg"><i class="on"></i><i></i><i></i><i></i></div>
    <div class="acts"><div class="act${opts.dim ? ' off' : ''}"><i data-i="tool" data-s="18"></i>工具</div>${mic}<div class="act${opts.dim ? ' off' : ''}"><i data-i="reply" data-s="18"></i>快捷回复</div></div></div>`;
}
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('[data-sb]').forEach(e => e.outerHTML = SB);
  document.querySelectorAll('[data-tbar]').forEach(e => e.outerHTML = tbar(e.dataset.dot || '<span class="dot d-g"></span>', e.dataset.tbar, { off: 'off' in e.dataset, edit: 'edit' in e.dataset }));
  document.querySelectorAll('[data-dock]').forEach(e => e.outerHTML = dock({ off: 'off' in e.dataset, dim: 'dim' in e.dataset, mic: e.innerHTML.trim() || null }));
  document.querySelectorAll('[data-wave]').forEach(e => {
    const hs = e.dataset.wave.split(',').map(Number);
    e.innerHTML = hs.map(h => `<i style="height:${h}px"></i>`).join('');
  });
  renderIcons();
});
</script></head>
