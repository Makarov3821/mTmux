<header class="board-head">
  <h1>方案 A 第二版 · tmux Doctor 与 0.9 新增界面</h1>
  <p>0.9.0 新增 tmux Doctor（保存后邀请、诊断报告、最小配置、撤销）、服务器菜单里的 Doctor 入口和“tmux 不可用”状态。现在这些界面都是默认 AlertDialog：一长串 ✓ / ⚠ 文字、操作按钮散落在正文里。这一版沿用第二版的底部面板、阶段卡和浮动卡片：结论放在最前，问题项展开、正常项收起，每个问题旁边直接给出可做的操作。</p>
  <div class="tags"><span>Doctor 使用接近全屏的底部面板，文字和规则不变</span><span>报告顺序：总结 → 需要注意 → 正常（收起）</span><span>配置预览按文件样式展示</span></div>
</header>
